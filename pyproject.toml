[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-img-paste-xplat"
version = "0.1.0.dev0"
description = "Experimental Windows and Linux core for SSH Image Paste"
readme = "xplat/README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Khaier Eddine Amamou" }
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
]

[project.scripts]
ssh-img-paste-xplat = "xplat.ssh_image_paste:main"

[tool.setuptools]
packages = ["xplat"]
