name: Windows desktop app

on:
  push:
    branches:
      - feat/windows-desktop-app
    paths:
      - "windows/**"
      - "rust/**"
      - ".github/workflows/windows-desktop.yml"
  pull_request:
    paths:
      - "windows/**"
      - "rust/**"
      - ".github/workflows/windows-desktop.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build the CLI and the fake OpenSSH used by the contracts
        run: |
          cargo build --locked --release --manifest-path rust/ssh-img-paste-cli/Cargo.toml
          cargo build --locked --examples --manifest-path rust/ssh-img-paste-cli/Cargo.toml
      - name: Run desktop app contracts against the real CLI
        shell: pwsh
        run: |
          $env:SSH_IMG_PASTE_FAKE_OPENSSH = "$PWD\rust\ssh-img-paste-cli\target\debug\examples\fake_openssh.exe"
          dotnet run --project windows/SSHImagePaste.Windows.ContractTests/SSHImagePaste.Windows.ContractTests.csproj --configuration Release
      - name: Build the WPF desktop app
        run: dotnet build windows/SSHImagePaste.Windows/SSHImagePaste.Windows.csproj --configuration Release
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build the installer and portable zip
        shell: pwsh
        run: ./windows/installer/build-installer.ps1 -SkipCli -Iscc "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
      - name: Upload the installer and portable zip
        uses: actions/upload-artifact@v4
        with:
          name: ssh-img-paste-windows-x64
          path: |
            windows/artifacts/SSHImagePaste-Setup-*.exe
            windows/artifacts/SSHImagePaste-*-portable.zip
          if-no-files-found: error
