name: Cross-platform core

on:
  push:
    branches:
      - feat/cross-platform-core
      - feat/production-rust-cli
      - feat/windows-desktop-app
  pull_request:
    paths:
      - "xplat/**"
      - "rust/**"
      - "docs/CROSS_PLATFORM_ARCHITECTURE.md"
      - "contract/**"
      - "tests/test_xplat.py"
      - "tests/test_linux_e2e.py"
      - "tests/test-cross-platform-contract.sh"
      - "tests/test-linux-desktop.sh"
      - "tests/fake_sni_watcher.py"
      - "pyproject.toml"
      - ".github/workflows/cross-platform.yml"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Ubuntu end-to-end dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 libadwaita-1-dev libgtk-4-dev openssh-server python3-gi scrot xclip xvfb
          sudo mkdir -p /run/sshd
      - name: Verify Bash profile contract fixtures
        if: runner.os == 'Linux'
        shell: bash
        run: ./tests/test-cross-platform-contract.sh
      - name: Run Rust contract tests
        run: cargo test --locked --manifest-path rust/ssh-img-paste-core/Cargo.toml
      - name: Run production Rust CLI contract tests
        run: cargo test --locked --manifest-path rust/ssh-img-paste-cli/Cargo.toml --all-targets
      - name: Run Python tracer tests
        run: python -m unittest tests.test_xplat -v
      - name: Run Ubuntu X11 and SCP end-to-end test
        if: runner.os == 'Linux'
        run: python -m unittest tests.test_linux_e2e -v
      - name: Build and test Linux desktop app
        if: runner.os == 'Linux'
        env:
          SSH_IMG_PASTE_E2E_CLI: ${{ github.workspace }}/rust/ssh-img-paste-cli/target/debug/ssh-img-paste
          SSH_IMG_PASTE_E2E_FAKE_OPENSSH: ${{ github.workspace }}/rust/ssh-img-paste-cli/target/debug/examples/fake_openssh
        run: |
          cargo build --locked --manifest-path rust/ssh-img-paste-cli/Cargo.toml --bin ssh-img-paste --example fake_openssh
          xvfb-run -a -s '-screen 0 1024x768x24 -nolisten tcp' \
            cargo test --locked --manifest-path rust/ssh-img-paste-linux/Cargo.toml
          cargo build --locked --manifest-path rust/ssh-img-paste-linux/Cargo.toml
          timeout 10s dbus-run-session -- xvfb-run -a -s '-screen 0 1024x768x24 -nolisten tcp' \
            rust/ssh-img-paste-linux/target/debug/ssh-img-paste-linux --smoke-test
          timeout 120s dbus-run-session -- xvfb-run -a -s '-screen 0 1024x768x24 -nolisten tcp' \
            tests/test-linux-desktop.sh
      - name: Install experimental Python tracer
        run: python -m pip install .
      - name: Verify installed entry point
        run: ssh-img-paste-xplat --help
