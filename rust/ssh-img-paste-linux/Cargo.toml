[package]
name = "ssh-img-paste-linux"
version = "0.1.0-dev"
edition = "2024"
publish = false
license = "MIT"
rust-version = "1.92"

[dependencies]
ssh-img-paste-core = { path = "../ssh-img-paste-core" }
gtk = { package = "gtk4", version = "0.11.4" }
adw = { package = "libadwaita", version = "0.9.2", features = ["gtk_v4_6", "v1_5"] }
ksni = "0.3.6"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "ssh-img-paste-linux"
path = "src/main.rs"
